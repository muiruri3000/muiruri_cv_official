name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      localhost:
        image: postgres:15
        env:
          POSTGRES_DB: ${{secrets.POSTGRES_DB}}
          POSTGRES_USER: ${{secrets.POSTGRES_USER}}
          POSTGRES_PASSWORD: ${{secrets.POSTGRES_PASSWORD}}
        ports:
        - 5432:5432
        options: >-
          --health-cmd="pg_isready"  --health-interval=10s  --health-timeout=5s  --health-retries=5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.11
    - name: Install dependencies
      working-directory: ./cv_backend
      run: |
        pip install -r requirements.txt

    - name: Run Django migrations
      working-directory: ./cv_backend
      env:
        POSTGRES_DB: ${{secrets.POSTGRES_DB}}
        POSTGRES_USER: ${{secrets.POSTGRES_USER}}
        POSTGRES_PASSWORD: ${{secrets.POSTGRES_PASSWORD}}
        POSTGRES_HOST: localhost
        POSTGRES_PORT: 5432
      run: |
        python manage.py migrate

    # Set up React
    - name: Set Up Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install React dependencies
      working-directory: ./my-digital-canvas
      run: |
        npm install

    - name: Build React app
      working-directory: ./my-digital-canvas
      run: |
        npm run build

    # log in to Docker Hub and push the image

    - name: Log in to Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Build backend Docker image
      run: |
        docker build -t ${DOCKER_USERNAME}/cv_backend:latest ./cv_backend

    - name: Build frontend Docker image
      run: |
        docker build -t ${DOCKER_USERNAME}/cv_frontend:latest ./my-digital-canvas

    - name: Push backend Docker image
      run: |
        docker push ${DOCKER_USERNAME}/cv_backend:latest

    - name: Push frontend Docker image
      run: |
        docker push ${DOCKER_USERNAME}/cv_frontend:latest
