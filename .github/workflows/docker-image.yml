name: Docker Build & Push

on:
  push:
    branches: [ main ]

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Log in to Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Build backend image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/cv_backend:latest ./cv_backend

    - name: Build frontend image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/cv_frontend:latest ./my-digital-canvas

    - name: Push backend image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/cv_backend:latest

    - name: Push frontend image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/cv_frontend:latest
