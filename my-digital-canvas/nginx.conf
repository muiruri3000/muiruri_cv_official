server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing fix (React Router support)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static asset caching (Vite hashed files)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Optional: prevent caching of HTML (so updates reflect immediately)
    location /index.html {
        add_header Cache-Control "no-cache";
    }
}